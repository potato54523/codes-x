<!DOCTYPE html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能体</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{padding:12px;}
#out{border:1px solid #999;padding:8px;min-height:120px;margin-bottom:8px;white-space:pre-wrap;}
#inp{width:100%;padding:6px;}
</style>
</head>
<body>
<div id="out"></div>
<input id="inp" placeholder="输入问题">
<button id="send">发送</button>

<script>
const WORKER_URL = "/api/chat";
const systemPrompt = `你要回答中文问题，回答时不要包含任何英文。`;

const out = document.querySelector('#out');
const inp = document.querySelector('#inp');
const send = document.querySelector('#send');
let busy = false;

async function chat(){
  const q = inp.value.trim();
  if(!q || busy) return;
  busy = true;
  send.disabled = true;
  out.textContent = ""; // 发新问题自动清空输出框
  inp.value = "";

  try{
    const res = await fetch(WORKER_URL,{
      method:"POST",
      headers:{"Content‑Type":"application/json"},
      body:JSON.stringify({system:systemPrompt,prompt:q})
    })
    if(!res.ok) throw 1;
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    while(true){
      const {done,value} = await reader.read();
      if(done) break;
      out.textContent += dec.decode(value,{stream:true});
    }
  }catch{
    out.textContent = "请求出错";
  }
  busy = false;
  send.disabled = false;
}

send.onclick = chat;
inp.addEventListener('keydown',e=>e.key==='Enter'&&chat())
</script>
</body>
</html>
